<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>끼리끼리 · P 권한 관리</title>
<style>
:root{--y:#FEF08A;--ink:#1E293B;--g:#FFD700}*{box-sizing:border-box}body{margin:0;background:var(--y);color:var(--ink);font-family:Arial,'Malgun Gothic',sans-serif}.wrap{max-width:680px;margin:auto;padding:14px}.card{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:14px;margin:12px 0;box-shadow:1px 3px 0 var(--ink)}h1{margin:4px 0}small,.muted{color:#64748b}input{font:inherit;border:2px solid var(--ink);border-radius:7px;padding:9px;width:100%;margin:4px 0}button{font:inherit;font-weight:bold;background:var(--g);color:var(--ink);border:2px solid var(--ink);border-radius:7px;padding:8px 10px;margin:3px;cursor:pointer}.row{display:flex;gap:6px;align-items:center}.row>*{flex:1;min-width:0}.hide{display:none!important}.result{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid #ddd}.badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:6px;background:#dc2626;color:white;font-size:11px;font-weight:800;vertical-align:middle;border-radius:2px}.status{white-space:pre-wrap}.p-letter{color:#dc2626;font-weight:900}
</style>
</head>
<body><main class="wrap">
<h1>끼리끼리 <small>KKiRiKKiRi</small></h1><p class="muted">P 권한 관리 전용 페이지</p>
<section class="card" id="loginCard"><h3>관리자 로그인</h3><label><small>아이디</small></label><input id="loginId" maxlength="10" autocomplete="username" placeholder="아이디"><label><small>비밀번호</small></label><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호"><button id="loginBtn">로그인</button><p id="loginStatus" class="status muted">관리자 계정으로 로그인하세요.</p></section>
<section class="card hide" id="adminCard"><div class="row"><h3 style="margin:4px 0">P 권한 관리</h3><button id="logoutBtn">로그아웃</button></div><p class="muted">사용자 아이디 또는 닉네임을 검색해 글씨 꾸미기 권한을 부여하거나 회수합니다.</p><div class="row"><input id="userSearch" placeholder="아이디 또는 닉네임"><button id="searchBtn">검색</button></div><div id="results"></div><p id="adminStatus" class="status muted"></p></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import{getAuth,signInWithCustomToken,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import{getFirestore,doc,deleteDoc,setDoc,collection,getDocs,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBiV_4mm2TbcC4bJsLkJpcXiUztZGFYBL0",authDomain:"kkiri-kkiri-sns.firebaseapp.com",projectId:"kkiri-kkiri-sns",storageBucket:"kkiri-kkiri-sns.firebasestorage.app",messagingSenderId:"739393951571",appId:"1:739393951571:web:7c601229be7c13d1e7b3a6"});
const auth=getAuth(app),db=getFirestore(app),WORKER_URL="https://kkirikkiri-auth.hiyds1.workers.dev",CREATOR_UID="2JOdaL1pWBSNjJFdFnNnKJUkhyk1",$=id=>document.getElementById(id);let me=null,permissions=new Set(),unsub=null;
const norm=s=>String(s||"").trim().toLocaleLowerCase("ko-KR");
function show(id,msg){$(id).textContent=msg}
function err(e){if(e.code==="permission-denied")return"Firestore 보안 규칙에서 권한이 거부됐습니다.";if(e.code==="auth/invalid-credential")return"아이디 또는 비밀번호를 확인하세요.";return e.message||"오류가 발생했습니다."}
$("loginBtn").onclick=async()=>{try{$("loginBtn").disabled=true;const id=$("loginId").value.trim(),password=$("password").value;if(!id||!password)throw Error("아이디와 비밀번호를 입력하세요.");const r=await fetch(`${WORKER_URL}/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,password})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.customToken)throw Error(data.error||"로그인에 실패했습니다.");await signInWithCustomToken(auth,data.customToken)}catch(e){show("loginStatus",err(e))}finally{$("loginBtn").disabled=false}};
$("logoutBtn").onclick=()=>signOut(auth);
async function searchUsers(){const q=norm($("userSearch").value);if(!q){show("adminStatus","검색어를 입력하세요.");$("results").innerHTML="";return}try{show("adminStatus","검색 중...");const snap=await getDocs(collection(db,"users"));const matches=snap.docs.map(d=>({uid:d.id,...d.data()})).filter(u=>`${u.id||""} ${u.nick||""}`.toLocaleLowerCase("ko-KR").includes(q)).slice(0,30);$("results").innerHTML=matches.map(u=>{const creator=u.uid===CREATOR_UID,granted=permissions.has(u.uid);const status=creator?"창조주 · 기본 P 권한":granted?"P 권한 사용 중":"P 권한 없음";const action=creator?"":`<button type="button" data-uid="${u.uid}" data-granted="${granted}">${granted?"권한 회수":"<span class=\"p-letter\">P</span> 권한 허락"}</button>`;return `<div class="result"><span><b>${escapeHtml(u.nick||u.id||"사용자")}</b> <small>${escapeHtml(u.id||"")}${u.nick?" · "+escapeHtml(u.nick):""}</small>${creator||granted?'<span class="badge">P</span>':""}<br><small>${status}</small></span>${action}</div>`}).join("")||'<small class="muted">검색 결과가 없습니다.</small>';show("adminStatus",`${matches.length}명 표시`)}catch(e){show("adminStatus",err(e))}}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("searchBtn").onclick=searchUsers;$("userSearch").onkeydown=e=>{if(e.key==="Enter")searchUsers()};
$("results").addEventListener("click",async e=>{const b=e.target.closest("button[data-uid]");if(!b)return;const uid=b.dataset.uid;if(uid===CREATOR_UID)return;try{if(b.dataset.granted==="true"){if(!confirm("이 사용자의 P 권한을 회수할까요?"))return;await deleteDoc(doc(db,"formatPermissions",uid));permissions.delete(uid)}else{if(!confirm("이 사용자에게 P 권한을 허락할까요?"))return;await setDoc(doc(db,"formatPermissions",uid),{grantedBy:me.uid,grantedAt:serverTimestamp()});permissions.add(uid)}await searchUsers()}catch(e){alert(err(e))}});
onAuthStateChanged(auth,u=>{me=u;if(unsub){unsub();unsub=null}permissions=new Set();if(!u){$("loginCard").classList.remove("hide");$("adminCard").classList.add("hide");return}if(u.uid!==CREATOR_UID){show("loginStatus","관리자 계정이 아닙니다. 로그아웃합니다.");signOut(auth);return}$("loginCard").classList.add("hide");$("adminCard").classList.remove("hide");unsub=onSnapshot(collection(db,"formatPermissions"),snap=>{permissions=new Set(snap.docs.map(d=>d.id));if($("userSearch").value.trim())searchUsers()},e=>show("adminStatus",err(e)));show("adminStatus","관리자 인증 완료")});
</script></body></html>
