
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>끼리끼리</title>
<style>
:root{--y:#FEF08A;--ink:#1E293B;--g:#FFD700}
*{box-sizing:border-box}
body{margin:0;background:var(--y);color:var(--ink);font-family:Arial,'Malgun Gothic',sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px}
.card,.post{background:white;border:2px solid var(--ink);border-radius:12px;padding:14px;margin:12px 0;box-shadow:1px 3px 0 var(--ink)}
#allScreen .post{background:#e3ffe7}
.post-shell{margin:12px 0}
.post.post-paper{background:#fff7da;margin:0 0 8px}
.post-tools,.post-comments,.post-reply{margin:6px 0 0}
.post-tools button,.post-comments button{vertical-align:middle}
.post-comments{padding:0 8px}
.post-reply input{background:white}
h1{margin:4px 0}
small,.muted{color:#64748b}
input,textarea{font:inherit;border:2px solid var(--ink);border-radius:7px;padding:9px;width:100%;margin:4px 0}
button{font:inherit;font-weight:bold;background:var(--g);color:var(--ink);border:2px solid var(--ink);border-radius:7px;padding:8px 10px;margin:3px;cursor:pointer}
button:disabled{opacity:.4}
button[data-ice]{background:#B9E7FF}
button[data-ice]:disabled{opacity:1;background:#B9E7FF;cursor:not-allowed}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1;min-width:0}
.symbols{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.symbols button{padding:8px 0;background:#F5F5DC;margin:0}
.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.tag{display:inline-block;background:#fff4b8;border:1px solid;border-radius:16px;padding:3px 7px;margin:3px}
.comment{border-top:1px solid #ddd;padding:8px 0}
.hide{display:none!important}
.post-content img{display:block;max-width:100%;max-height:400px;object-fit:contain;margin:10px auto;border-radius:7px}
.status{white-space:pre-wrap;margin-top:8px}
.p-badge{display:inline-flex;align-items:center;justify-content:center;flex:0 0 16px;width:16px;height:16px;margin-left:3px;background:#dc2626;color:#fff;font-size:11px;font-weight:800;line-height:1;vertical-align:middle;border-radius:2px}
.post-paper>b,.comment>b{display:inline-flex;align-items:center;vertical-align:middle;line-height:1.2}
.post-paper>small,.comment>small{display:inline-block;vertical-align:middle;margin-left:7px;line-height:1.2}
.format-toolbar{display:flex;flex-wrap:nowrap;align-items:center;gap:4px;margin:8px 0;width:100%}
.format-toolbar button{flex:1;min-width:0;margin:0;padding:7px 3px;background:#F5F5DC;white-space:nowrap;font-size:13px}
.format-toolbar input[type=color]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#postText{min-height:130px;width:100%;border:2px solid var(--ink);border-radius:7px;padding:10px;background:#fff;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;outline:none}
#postText:empty:before{content:attr(data-placeholder);color:#94a3b8;pointer-events:none}
.format-admin-result{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #ddd}
#commentModal{position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:9999;display:flex;align-items:center;justify-content:center;padding:14px}
#commentModal.hide{display:none!important}
.comment-dialog{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.comment-dialog h3{margin:0 0 10px}
#commentEditorHost #postText{min-height:150px}
#commentEditorHost .symbols{margin-top:8px}
.comment-modal-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
.comment-modal-actions button{flex:0 0 auto}
#commentModalStatus{white-space:pre-wrap;margin-top:8px;color:#b91c1c}

/* 제목과 휴지통 아이콘 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar h1{margin:4px 0}
.topbar .muted{margin:5px 0 0}
.trash-icon{
  flex:0 0 46px;
  width:46px;
  height:42px;
  margin:0;
  padding:5px;
  background:#bfdbfe;
  font-size:23px;
  display:flex;
  align-items:center;
  justify-content:center
}

@media(max-width:480px){
  .wrap{padding:8px}
  .card,.post{padding:10px}
  .symbols{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>

<body>
<main class="wrap">

<!-- 제목과 휴지통 -->
<div class="topbar">
  <div>
    <h1>끼리끼리 <small>KKiRiKKiRi</small></h1>
    <p class="muted">끼리끼리 SNS</p>
  </div>
  <button id="openTrash" class="trash-icon" type="button" title="휴지통" aria-label="휴지통">🗑️</button>
</div>

<section class="card" id="authCard">
<h3 id="authTitle">아이디 로그인</h3>
<div id="loginIdField">
<label><small>아이디</small></label>
<input id="loginId" maxlength="10" autocomplete="username" placeholder="아이디">
</div>
<div id="signupFields" class="hide">
<label><small>아이디 (한글·영문 시작, 5~10자)</small></label>
<input id="newId" maxlength="10" autocomplete="username" placeholder="아이디">
<label><small>닉네임 (선택, 3~5자)</small></label>
<input id="newNick" maxlength="5" placeholder="닉네임 (선택)">
</div>
<div id="emailField" class="hide">
<label><small>이메일 (회원가입용)</small></label>
<input id="email" type="email" autocomplete="email" placeholder="이메일 주소">
</div>
<label><small>비밀번호</small></label>
<input id="password" type="password" autocomplete="current-password" placeholder="비밀번호">
<div class="row">
<button id="authSubmit">로그인</button>
<button id="resetPassword">비밀번호 재설정</button>
<button id="signupMode">회원가입</button>
</div>
<p id="authStatus" class="muted">아이디와 비밀번호로 로그인하세요.</p>
</section>

<section class="card hide" id="accountCard">
<h3>내 계정</h3>
<div id="accountInfo"></div>
<div class="row">
<button id="showProfile">아이디·닉네임 변경</button>
<button id="logout" style="background:#FFD700">로그아웃</button>
</div>
<div id="profileEditor" class="hide">
<label><small>아이디 변경 (30일에 한 번)</small></label>
<input id="changeId" maxlength="10">
<label><small>닉네임 변경 (24시간에 한 번, 비우면 해제)</small></label>
<input id="changeNick" maxlength="5">
<div class="row">
<button id="saveProfile">변경 저장</button>
<button id="cancelProfile">취소</button>
</div>
</div>
</section>

<section class="card hide" id="searchScreen">
<h3>검색</h3>
<div class="row">
<input id="search" placeholder="#해시태그 또는 사용자 검색">
<button id="searchbtn">검색</button>
<button id="clearSearch">전체 글</button>
</div>
<div id="searchResults" class="hide">
<hr style="border:0;border-top:1px solid #e2e8f0;margin:14px 0">
<h3 id="searchResultTitle">검색 결과</h3>
<div id="searchFeed"></div>
</div>
</section>

<section class="card hide" id="compose">
<h3 id="composeTitle">새 끼리 <small id="count">0 / 200자</small></h3>
<div id="formatToolbar" class="hide">
<div class="format-toolbar">
<button type="button" data-command="bold" title="굵게"><b>B</b></button>
<button type="button" data-command="italic" title="기울임"><i>I</i></button>
<button type="button" data-command="underline" title="밑줄"><u>U</u></button>
<button type="button" id="textColorBtn" title="글씨색">A ▾<input id="textColorPicker" type="color" value="#dc2626" aria-label="글씨색 선택"></button>
<button type="button" id="bgColorBtn" title="배경색">▰ ▾<input id="bgColorPicker" type="color" value="#fff2a8" aria-label="배경색 선택"></button>
</div>
</div>
<div id="postText" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="끼리를 작성하세요. (최대 200자)"></div>
<div class="row"><small>사진 첨부 없음 · 글과 링크만</small></div>
<div id="symbols" class="symbols"></div>
<div class="row">
<button id="publish">끼리 올리기</button>
<button id="cancelEdit" class="hide">수정 취소</button>
</div>
<p id="postStatus" class="muted"></p>
</section>

<section class="card hide" id="mineScreen">
<h3 id="resultTitle">내 끼리</h3>
<div id="mineTools" class="hide">
  <button id="select">선택 삭제</button>
  <button id="delall">전체 삭제</button>
</div>
<div id="feed">
  <p class="muted">내 끼리가 아직 없습니다.</p>
</div>
</section>

<section class="card hide" id="allScreen">
<h3>전체 끼리</h3>
<div id="allFeed"></div>
</section>

</main>

<div id="commentModal" class="hide" role="dialog" aria-modal="true" aria-labelledby="commentModalTitle">
  <div class="comment-dialog">
    <h3 id="commentModalTitle">댓글 작성 <small id="commentCount">0 / 200자</small></h3>
    <div id="commentEditorHost"></div>
    <div class="comment-modal-actions">
      <button type="button" id="commentModalCancel">취소</button>
      <button type="button" id="commentModalSave">댓글 등록</button>
    </div>
    <p id="commentModalStatus"></p>
  </div>
</div>

<script type="module">
import{
getAuth,
createUserWithEmailAndPassword,
signInWithCustomToken,
signOut,
onAuthStateChanged,
setPersistence,
browserLocalPersistence
}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import{getFirestore,doc,getDoc,updateDoc,deleteDoc,setDoc,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp,runTransaction,getDocs,writeBatch,limit}from"https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyBiV_4mm2TbcC4bJsLkJpcXiUztZGFYBL0",
authDomain:"kkiri-kkiri-sns.firebaseapp.com",
projectId:"kkiri-kkiri-sns",
storageBucket:"kkiri-kkiri-sns.firebasestorage.app",
messagingSenderId:"739393951571",
appId:"1:739393951571:web:7c601229be7c13d1e7b3a6"
});

const auth=getAuth(app),db=getFirestore(app);

await setPersistence(auth,browserLocalPersistence);
const WORKER_URL="https://kkirikkiri-auth.hiyds1.workers.dev";
const $=id=>document.getElementById(id);
const ID=/^[가-힣A-Za-z][가-힣A-Za-z0-9]{4,9}$/;
const NICK=/^[가-힣A-Za-z\u00C0-\u024F\u1E00-\u1EFF]{3,5}$/u;

let mode="login",me=null,profile=null,posts=[],unsubPosts=null;
let unsubComments=new Map(),comments=new Map(),editing=null,selectMode=false;
let profiles=new Map(),formatUids=new Set(),unsubPermissions=null;
let editingMarks=[],savedSelection={start:0,end:0};
let commentModalPostId=null,commentModalId=null,commentDraftHTML="";
let commentDraftRange=null,commentSlots=null;

const CREATOR_UID="2JOdaL1pWBSNjJFdFnNnKJUkhyk1";
const norm=s=>s.trim().toLocaleLowerCase("ko-KR");
const say=(id,s)=>{$(id).textContent=s;$(id).classList.remove("hide")};

function err(e){
const m={
"auth/email-already-in-use":"이미 가입된 이메일입니다.",
"auth/invalid-email":"이메일 형식을 확인하세요.",
"auth/weak-password":"비밀번호를 더 길게 설정하세요.",
"auth/invalid-credential":"아이디 또는 비밀번호를 확인하세요.",
"auth/too-many-requests":"인증 요청이 일시 제한됐습니다. 잠시 기다린 뒤 다시 시도하세요.",
"permission-denied":"Firestore 보안 규칙을 확인하세요.",
"functions/not-found":"아이디 로그인 서버 기능을 배포해야 합니다.",
"functions/unauthenticated":"아이디 또는 비밀번호를 확인하세요.",
"functions/invalid-argument":"아이디 형식을 확인하세요."
};
return m[e.code]||e.message||"오류가 발생했습니다.";
}

function setMode(m){
mode=m;
const signup=m==="signup";
$("signupFields").classList.toggle("hide",!signup);
$("emailField").classList.toggle("hide",!signup);
$("loginIdField").classList.toggle("hide",signup);
$("authTitle").textContent=signup?"회원가입":"아이디 로그인";
$("authSubmit").textContent=signup?"가입하기":"로그인";
$("signupMode").textContent=signup?"로그인으로 돌아가기":"회원가입";
$("password").autocomplete=signup?"new-password":"current-password";
}

$("signupMode").onclick=()=>setMode(mode==="signup"?"login":"signup");

$("resetPassword").onclick=async()=>{
try{
const id=$("loginId").value.trim();
if(!id)throw Error("아이디를 먼저 입력하세요.");

const response=await fetch(`${WORKER_URL}/reset-password`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id})
});

const data=await response.json().catch(()=>({}));
if(!response.ok)throw Error(data.error||"재설정 요청에 실패했습니다. 잠시 후 다시 시도하세요.");

say("authStatus","가입한 이메일로 비밀번호 재설정 메일을 보냈습니다. 가입 여부와 관계없이 같은 안내가 표시될 수 있습니다.");
}catch(e){
say("authStatus",err(e));
}
};

$("authSubmit").onclick=async()=>{
try{
$("authSubmit").disabled=true;
const password=$("password").value;
if(!password)throw Error("비밀번호를 입력하세요.");

if(mode==="login"){
const id=$("loginId").value.trim();
if(!id)throw Error("아이디를 입력하세요.");

const response=await fetch(`${WORKER_URL}/login`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id,password})
});

const data=await response.json().catch(()=>({}));
if(!response.ok)throw Error(data.error||"로그인에 실패했습니다. 아이디와 비밀번호를 확인하세요.");
if(!data.customToken)throw Error("로그인 응답을 확인할 수 없습니다. 잠시 후 다시 시도하세요.");

await signInWithCustomToken(auth,data.customToken);
return;
}

const email=$("email").value.trim();
if(!email)throw Error("이메일을 입력하세요.");

const id=$("newId").value.trim();
const nick=$("newNick").value.trim();

if(!ID.test(id))throw Error("아이디는 한글·영문으로 시작하는 5~10자여야 합니다.");
if(nick&&!NICK.test(nick))throw Error("닉네임은 한글·영문 3~5자로 입력하세요.");

const c=await createUserWithEmailAndPassword(auth,email,password);

try{
await runTransaction(db,async t=>{
const ur=doc(db,"users",c.user.uid);
const ir=doc(db,"idClaims",norm(id));
const is=await t.get(ir);

if(is.exists())throw Error("이미 사용 중인 아이디입니다.");

let nr,ns;
if(nick){
nr=doc(db,"nickClaims",norm(nick));
ns=await t.get(nr);
if(ns.exists())throw Error("이미 사용 중인 닉네임입니다.");
}

t.set(ur,{id,nick,email,createdAt:serverTimestamp(),lastIdChangeAt:null,lastNickChangeAt:null});
t.set(ir,{uid:c.user.uid});
if(nr)t.set(nr,{uid:c.user.uid});
});
}catch(e){
await c.user.delete().catch(()=>{});
throw e;
}
}catch(e){
say("authStatus",err(e));
}finally{
$("authSubmit").disabled=false;
}
};

$("logout").onclick=async()=>{
try{await signOut(auth)}catch(e){alert(err(e))}
};

$("showProfile").onclick=()=>{
$("profileEditor").classList.toggle("hide");
$("changeId").value=profile?.id||"";
$("changeNick").value=profile?.nick||"";
};

$("cancelProfile").onclick=()=>$("profileEditor").classList.add("hide");

$("saveProfile").onclick=async()=>{
try{
const id=$("changeId").value.trim();
const nick=$("changeNick").value.trim();

if(!ID.test(id))throw Error("아이디는 한글·영문으로 시작하는 5~10자여야 합니다.");
if(nick&&!NICK.test(nick))throw Error("닉네임은 한글·영문 3~5자로 입력하세요.");

await runTransaction(db,async t=>{
const ur=doc(db,"users",me.uid);
const us=await t.get(ur);
if(!us.exists())throw Error("프로필이 없습니다.");

const old=us.data();
const ic=doc(db,"idClaims",norm(id));
const icSnap=await t.get(ic);

let nc,ns;
if(nick){
nc=doc(db,"nickClaims",norm(nick));
ns=await t.get(nc);
}

if(id!==old.id&&icSnap.exists()&&icSnap.data().uid!==me.uid)
throw Error("이미 사용 중인 아이디입니다.");

if(nick&&ns?.exists()&&ns.data().uid!==me.uid)
throw Error("이미 사용 중인 닉네임입니다.");

const now=Date.now();

if(id!==old.id&&old.lastIdChangeAt&&now-old.lastIdChangeAt.toMillis()<30*86400000)
throw Error("아이디 변경 후 30일이 지나야 합니다.");

if(nick!==(old.nick||"")&&old.lastNickChangeAt&&now-old.lastNickChangeAt.toMillis()<86400000)
throw Error("닉네임 변경 후 24시간이 지나야 합니다.");

if(id!==old.id){
t.delete(doc(db,"idClaims",norm(old.id)));
t.set(ic,{uid:me.uid});
}

if(nick!==(old.nick||"")){
if(old.nick)t.delete(doc(db,"nickClaims",norm(old.nick)));
if(nick)t.set(nc,{uid:me.uid});
}

t.update(ur,{
id,nick,
lastIdChangeAt:id!==old.id?serverTimestamp():old.lastIdChangeAt,
lastNickChangeAt:nick!==(old.nick||"")?serverTimestamp():old.lastNickChangeAt
});
});

$("profileEditor").classList.add("hide");
await loadProfile();
renderAll();
}catch(e){
alert(err(e));
}
};

async function loadProfile(){
const s=await getDoc(doc(db,"users",me.uid));
profile=s.exists()?s.data():null;
}

onAuthStateChanged(auth,async u=>{
me=u;

if(unsubPosts)unsubPosts();
if(unsubPermissions)unsubPermissions();

unsubComments.forEach(f=>f());
unsubComments.clear();
comments.clear();
formatUids=new Set();
profile=null;
posts=[];

["accountCard","compose","searchScreen","mineScreen","allScreen"].forEach(id=>
$(id).classList.toggle("hide",!u)
);

$("authCard").classList.toggle("hide",!!u);

if(!u){
renderAll();
return;
}

try{
await loadProfile();
if(!profile)throw Error("프로필을 찾을 수 없습니다.");

unsubPermissions=onSnapshot(
collection(db,"formatPermissions"),
snap=>{
formatUids=new Set(snap.docs.map(d=>d.id));
renderAll();
},
e=>console.warn("P 권한 목록을 불러오지 못했습니다.",e)
);

unsubPosts=onSnapshot(
query(collection(db,"posts"),orderBy("createdAt","desc")),
snap=>{
posts=snap.docs.map(d=>({id:d.id,...d.data()}));
expireOldIce();
syncCommentListeners();
renderAll();
},
e=>say("authStatus",err(e))
);

renderAll();
}catch(e){
say("authStatus",err(e));
}
});

function syncCommentListeners(){
const ids=new Set(posts.map(p=>p.id));

for(const [id,fn]of unsubComments){
if(!ids.has(id)){
fn();
unsubComments.delete(id);
comments.delete(id);
}
}

for(const id of ids){
if(!unsubComments.has(id)){
unsubComments.set(id,onSnapshot(
query(collection(db,"posts",id,"comments"),orderBy("createdAt","asc")),
s=>{
comments.set(id,s.docs.map(d=>({id:d.id,...d.data()})));
renderAll();
},
()=>{}
));
}
}
}

function name(uid){
if(uid===me?.uid)return profile?.nick||profile?.id||"나";
return profiles.get(uid)?.nick||profiles.get(uid)?.id||"사용자";
}

function hasP(uid){
return uid===CREATOR_UID||formatUids.has(uid);
}

function authorLabel(uid){
return `${esc(name(uid))}${hasP(uid)?'&nbsp;<span class="p-badge" title="글씨 꾸미기 권한">P</span>':""}`;
}

function safeColor(v){
return typeof v==="string"&&/^#[0-9a-fA-F]{6}$/.test(v)?v.toUpperCase():"";
}

function renderStyledText(text,marks=[]){
const chars=[...String(text??"")];
const valid=(Array.isArray(marks)?marks:[]).filter(m=>
m&&Number.isInteger(m.start)&&Number.isInteger(m.end)&&
m.start>=0&&m.end>m.start&&m.end<=chars.length
);

let out="",last="";

for(let i=0;i<chars.length;){
const style={bold:false,italic:false,underline:false,color:"",bg:""};

for(const m of valid){
if(i>=m.start&&i<m.end){
style.bold=style.bold||m.bold===true;
style.italic=style.italic||m.italic===true;
style.underline=style.underline||m.underline===true;
if(safeColor(m.color))style.color=safeColor(m.color);
if(safeColor(m.bg))style.bg=safeColor(m.bg);
}
}

const key=JSON.stringify(style);
let j=i+1;

while(j<chars.length){
const next={bold:false,italic:false,underline:false,color:"",bg:""};

for(const m of valid){
if(j>=m.start&&j<m.end){
next.bold=next.bold||m.bold===true;
next.italic=next.italic||m.italic===true;
next.underline=next.underline||m.underline===true;
if(safeColor(m.color))next.color=safeColor(m.color);
if(safeColor(m.bg))next.bg=safeColor(m.bg);
}
}

if(JSON.stringify(next)!==key)break;
j++;
}

const css=[
style.bold?"font-weight:700":"",
style.italic?"font-style:italic":"",
style.underline?"text-decoration:underline":"",
style.color?`color:${style.color}`:"",
style.bg?`background-color:${style.bg}`:""
].filter(Boolean).join(";");

const part=chars.slice(i,j).join("");
out+=css?`<span style="${css}">${link(part)}</span>`:link(part);
i=j;
}

return out;
}

function esc(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function link(s){
return esc(s)
.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
.replace(/(^|\s)(#[가-힣A-Za-z0-9_]+)/g,'$1<span class="tag">$2</span>');
}

function millis(v){return v?.toMillis?v.toMillis():0}

function time(v){
return millis(v)?v.toDate().toLocaleString("ko-KR",{
year:"numeric",month:"2-digit",day:"2-digit",
hour:"2-digit",minute:"2-digit",hour12:false
}):"방금";
}

function editable(v){
return millis(v)>0&&Date.now()-millis(v)<3600000;
}

const syms=[
",",".","…","!","?","~",":",";","<",">","-","_","@","#","&","%","/","\\",
"(",")","*","[","]","{","}","+","−","×","÷","="
];

function calculateExpression(raw){
const expr=raw.replace(/\s+/g,"").replace(/×/g,"*").replace(/÷/g,"/");
if(!expr)return null;
if(!/^[0-9.+*/()−-]+$/.test(expr))return null;

const normalized=expr.replace(/−/g,"-");
if(!/^[0-9.+*/()\-]+$/.test(normalized))return null;

try{
const tokens=normalized.match(/(?:\d+(?:\.\d*)?|\.\d+)|[()+*/-]/g);
if(!tokens||tokens.join("")!==normalized)return null;

let pos=0;

function factor(){
const tok=tokens[pos++];
if(tok==="+")return factor();
if(tok==="-")return -factor();
if(tok==="("){
const v=expression();
if(tokens[pos++]!==")")throw Error("괄호");
return v;
}
if(tok===undefined||!/^\d+(?:\.\d*)?$|^\.\d+$/.test(tok))throw Error("숫자");
return Number(tok);
}

function term(){
let v=factor();
while(tokens[pos]==="*"||tokens[pos]==="/"){
const op=tokens[pos++],n=factor();
v=op==="*"?v*n:v/n;
}
return v;
}

function expression(){
let v=term();
while(tokens[pos]==="+"||tokens[pos]==="-"){
const op=tokens[pos++],n=term();
v=op==="+"?v+n:v-n;
}
return v;
}

const result=expression();
if(pos!==tokens.length||!Number.isFinite(result))return null;
return Number(result.toPrecision(12)).toString();
}catch{
return null;
}
}

const postArea=$("postText");
let savedRange=null;

function saveEditorSelection(){
const sel=getSelection();
if(sel&&sel.rangeCount&&postArea.contains(sel.anchorNode))
savedRange=sel.getRangeAt(0).cloneRange();
}

function restoreEditorSelection(){
postArea.focus();
const sel=getSelection();
if(savedRange){
sel.removeAllRanges();
sel.addRange(savedRange);
}
}

function selectedEditorRange(){
restoreEditorSelection();
const sel=getSelection();
if(!sel||!sel.rangeCount||!postArea.contains(sel.anchorNode))return null;
const r=sel.getRangeAt(0);
return r.collapsed?null:r.cloneRange();
}

function isFormatElement(el){
if(!el||el.nodeType!==Node.ELEMENT_NODE)return false;
const st=el.style||{};
return /^(B|STRONG|I|EM|U|FONT)$/.test(el.tagName)||
!!(st.fontWeight||st.fontStyle||st.textDecoration||st.color||st.backgroundColor);
}

function moveCaretOutsideFormatting(){
const sel=getSelection();
if(!sel||!sel.rangeCount)return;

let r=sel.getRangeAt(0).cloneRange();
r.collapse(false);
let node=r.startContainer;

while(node&&node!==postArea){
const parent=node.nodeType===Node.ELEMENT_NODE?node:node.parentNode;
if(!parent||parent===postArea)break;

if(isFormatElement(parent)){
const tailRange=document.createRange();
tailRange.setStart(r.startContainer,r.startOffset);
tailRange.setEnd(parent,parent.childNodes.length);
const tail=tailRange.extractContents();

if(tail.hasChildNodes()){
const right=parent.cloneNode(false);
right.appendChild(tail);
parent.parentNode.insertBefore(right,parent.nextSibling);
}

r=document.createRange();
r.setStartAfter(parent);
r.collapse(true);
node=parent.parentNode;
sel.removeAllRanges();
sel.addRange(r);
}else{
node=parent;
}
}

savedRange=sel.rangeCount?sel.getRangeAt(0).cloneRange():null;
}

function finishFormatAtSelectionEnd(){
moveCaretOutsideFormatting();
}

function colorHex(value){
if(!value)return "";
if(/^#[0-9a-f]{6}$/i.test(value))return value.toUpperCase();
const m=value.match(/\d+/g);
return m&&m.length>=3?"#"+m.slice(0,3).map(x=>Number(x).toString(16).padStart(2,"0")).join("").toUpperCase():"";
}

function collectEditorMarks(){
const marks=[];
let offset=0;

function walk(node,inherited={}){
if(node.nodeType===Node.TEXT_NODE){
const len=node.nodeValue.length,start=offset;
offset+=len;

if(len){
const m={start,end:offset};
if(inherited.bold)m.bold=true;
if(inherited.italic)m.italic=true;
if(inherited.underline)m.underline=true;
if(inherited.color)m.color=inherited.color;
if(inherited.bg)m.bg=inherited.bg;
if(Object.keys(m).length>2)marks.push(m);
}
return;
}

if(node.nodeType!==Node.ELEMENT_NODE)return;
if(node.tagName==="BR"){offset++;return;}

const st=node.style||{};
const next={...inherited};

if(node.tagName==="B"||node.tagName==="STRONG"||st.fontWeight==="bold"||Number(st.fontWeight)>=600)next.bold=true;
if(node.tagName==="I"||node.tagName==="EM"||st.fontStyle==="italic")next.italic=true;
if(node.tagName==="U"||st.textDecoration.includes("underline"))next.underline=true;
if(st.color)next.color=colorHex(st.color);
else if(node.tagName==="FONT"&&node.getAttribute("color"))next.color=colorHex(node.getAttribute("color"));
if(st.backgroundColor)next.bg=colorHex(st.backgroundColor);

for(const child of node.childNodes)walk(child,next);
}

for(const child of postArea.childNodes)walk(child,{});
return marks.slice(0,100);
}

function setEditorContent(text,marks=[]){
const chars=[...String(text||"")];
let html="";

for(let i=0;i<chars.length;){
if(chars[i]==="\n"){
html+="<br>";
i++;
continue;
}

const st={bold:false,italic:false,underline:false,color:"",bg:""};

for(const m of marks){
if(i>=m.start&&i<m.end){
st.bold=st.bold||m.bold===true;
st.italic=st.italic||m.italic===true;
st.underline=st.underline||m.underline===true;
if(m.color)st.color=safeColor(m.color);
if(m.bg)st.bg=safeColor(m.bg);
}
}

let j=i+1;

while(j<chars.length&&chars[j]!=="\n"){
const n={bold:false,italic:false,underline:false,color:"",bg:""};

for(const m of marks){
if(j>=m.start&&j<m.end){
n.bold=n.bold||m.bold===true;
n.italic=n.italic||m.italic===true;
n.underline=n.underline||m.underline===true;
if(m.color)n.color=safeColor(m.color);
if(m.bg)n.bg=safeColor(m.bg);
}
}

if(JSON.stringify(n)!==JSON.stringify(st))break;
j++;
}

const css=[
st.bold?"font-weight:700":"",
st.italic?"font-style:italic":"",
st.underline?"text-decoration:underline":"",
st.color?`color:${st.color}`:"",
st.bg?`background-color:${st.bg}`:""
].filter(Boolean).join(";");

const t=chars.slice(i,j).join("").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

html+=css?`<span style="${css}">${t}</span>`:t;
i=j;
}

postArea.innerHTML=html;
savedRange=null;
updateEditorCount();
}

function insertSymbol(s){
restoreEditorSelection();

if(s==="="){
const txt=editorText();
const sel=getSelection();
if(!sel.rangeCount)return;

const r=sel.getRangeAt(0);
const before=txt.slice(0,rangeOffset(r));
const answer=calculateExpression(before);
document.execCommand("insertText",false,answer!==null?`=${answer}`:"=");
}else{
document.execCommand("insertText",false,s);
}

saveEditorSelection();
updateEditorCount();
}

function rangeOffset(range){
const pre=range.cloneRange();
pre.selectNodeContents(postArea);
pre.setEnd(range.startContainer,range.startOffset);
return pre.toString().length;
}

if(editing){
const p=posts.find(p=>p.id===editing);

if(!p||p.authorUid!==me.uid||p.deletedAt)
throw Error("휴지통에 있는 글은 수정할 수 없습니다.");

if(!editable(p.createdAt))
throw Error("글 수정은 작성 후 1시간 이내만 가능합니다.");

if((p.editCount||0)>=5)
throw Error("끼리 수정은 최대 5회까지 가능합니다.");

await updateDoc(doc(db,"posts",editing),{
text,tags,
...(hasP(me.uid)?{marks}:{}),
editCount:(text===p.text?(p.editCount||0):(p.editCount||0)+1),
updatedAt:serverTimestamp()
});

editing=null;
$("composeTitle").innerHTML='새 끼리 <small id="count">0 / 200자</small>';
$("publish").textContent="끼리 올리기";
$("cancelEdit").classList.add("hide");
}else{
await addDoc(collection(db,"posts"),{
authorUid:me.uid,
text,tags,
...(hasP(me.uid)&&marks.length?{marks}:{}),
createdAt:serverTimestamp(),
updatedAt:serverTimestamp(),
editCount:0,
iced:false,
ice:0,
perma:false,
icedAt:null
});
}

postArea.innerHTML="";
editingMarks=[];
savedRange=null;
updateEditorCount();
$("postStatus").textContent="";
}catch(e){
say("postStatus",err(e));
}
};

$("cancelEdit").onclick=()=>{
editing=null;
editingMarks=[];
postArea.innerHTML="";
savedRange=null;
$("composeTitle").innerHTML='새 끼리 <small id="count">0 / 200자</small>';
$("publish").textContent="끼리 올리기";
$("cancelEdit").classList.add("hide");
updateEditorCount();
};

function doSearch(){
const q=norm($("search").value||"");

const found=posts.filter(p=>!p.deletedAt).filter(p=>{
const who=profiles.get(p.authorUid)||{};

const postMatch=`${p.text} ${(p.tags||[]).join(" ")} ${who.id||""} ${who.nick||""}`
.toLocaleLowerCase("ko-KR").includes(q);

const commentMatch=(comments.get(p.id)||[]).filter(c=>!c.deletedAt).some(c=>{
const cw=profiles.get(c.authorUid)||{};
return `${c.text||""} ${cw.id||""} ${cw.nick||""}`
.toLocaleLowerCase("ko-KR").includes(q);
});

return !q||postMatch||commentMatch;
});

$("searchResults").classList.toggle("hide",!q);

$("searchFeed").innerHTML=q?(found.map(p=>{
const matched=(comments.get(p.id)||[]).filter(c=>!c.deletedAt).filter(c=>{
const cw=profiles.get(c.authorUid)||{};
return `${c.text||""} ${cw.id||""} ${cw.nick||""}`
.toLocaleLowerCase("ko-KR").includes(q);
});

return card(p,false)+(matched.length?`
<div class="post-comments">
${matched.map(c=>`
<div class="comment">
<b>${authorLabel(c.authorUid)}</b>
<small>${time(c.createdAt)} · 검색된 댓글</small>
<div class="text">${link(c.text)}</div>
</div>
`).join("")}
</div>
`:"");
}).join("")||'<p class="muted">검색 결과가 없습니다.</p>'):"";
}

function resetSearch(){
$("search").value="";
$("searchResults").classList.add("hide");
$("searchFeed").innerHTML="";
}

resetSearch();
window.addEventListener("pageshow",resetSearch);

$("searchbtn").onclick=doSearch;
$("search").onkeydown=e=>{
if(e.key==="Enter")doSearch();
};
$("clearSearch").onclick=()=>{
$("search").value="";
doSearch();
};

async function movePostToTrash(id){
const p=posts.find(x=>x.id===id);
if(!p||p.authorUid!==me.uid)
throw Error("본인 글만 휴지통으로 이동할 수 있습니다.");

await updateDoc(doc(db,"posts",id),{
deletedAt:serverTimestamp(),
deletedBy:me.uid,
updatedAt:serverTimestamp()
});
}

async function moveCommentToTrash(postId,commentId){
const c=(comments.get(postId)||[]).find(x=>x.id===commentId);

if(!c||c.authorUid!==me.uid)
throw Error("본인 댓글만 휴지통으로 이동할 수 있습니다.");

await updateDoc(doc(db,"posts",postId,"comments",commentId),{
deletedAt:serverTimestamp(),
deletedBy:me.uid,
updatedAt:serverTimestamp()
});
}

/* 휴지통 바로가기 */
$("openTrash").addEventListener("click",()=>{
  location.href="./trash.html";
});

/* 내 글 선택 삭제 */
$("select").onclick=async()=>{
if(!selectMode){
selectMode=true;
$("select").textContent="선택 삭제 실행";
renderAll();
return;
}

const ids=[...document.querySelectorAll(".pick:checked")].map(x=>x.dataset.id);
selectMode=false;
$("select").textContent="선택 삭제";

if(ids.length&&confirm(`선택한 ${ids.length}개 글을 휴지통으로 이동할까요?`)){
for(const id of ids)await movePostToTrash(id);
}

renderAll();
};

/* 내 글 전체 삭제 */
$("delall").onclick=async()=>{
const mine=posts.filter(p=>p.authorUid===me.uid&&!p.deletedAt);

if(!mine.length)return alert("휴지통으로 이동할 글이 없습니다.");

if(confirm(`내 끼리 ${mine.length}개를 모두 휴지통으로 이동할까요?`)){
for(const p of mine)await movePostToTrash(p.id);
}
};

/* 게시글 및 댓글 버튼 */
document.addEventListener("click",async e=>{
const b=e.target.closest("button[data-act]");
if(!b)return;

const {act,id,cid}=b.dataset;
const p=posts.find(p=>p.id===id);
if(!p)return;

try{
if(act==="edit"){
if(p.authorUid!==me.uid)throw Error("본인 글만 수정할 수 있습니다.");
if(!editable(p.createdAt))throw Error("수정 시간이 지났습니다.");
if((p.editCount||0)>=5)throw Error("끼리 수정은 최대 5회까지 가능합니다.");

editing=id;
editingMarks=Array.isArray(p.marks)?p.marks:[];
setEditorContent(p.text,p.marks||[]);
$("count").textContent=`${p.text.length} / 200자`;
$("composeTitle").innerHTML='끼리 수정 <small id="count">'+p.text.length+' / 200자</small>';
$("publish").textContent="수정 저장";
$("cancelEdit").classList.remove("hide");
postArea.focus();
$("compose").scrollIntoView({behavior:"smooth"});
}

if(act==="delete"&&p.authorUid===me.uid&&confirm("이 끼리를 휴지통으로 이동할까요?")){
await movePostToTrash(id);
}

if(act==="ice"&&p.authorUid===me.uid){
if(p.perma)throw Error("이미 영구 얼음 상태입니다.");

if(p.iced){
await updateDoc(doc(db,"posts",id),{
iced:false,icedAt:null,updatedAt:serverTimestamp()
});
}else{
const n=(p.ice||0)+1;
await updateDoc(doc(db,"posts",id),{
ice:n,
iced:true,
icedAt:serverTimestamp(),
perma:n>=3,
updatedAt:serverTimestamp()
});
}
}

if(act==="openComment"){
if(p.iced||p.perma)throw Error("댓글이 잠겨 있습니다.");
openCommentModal(id);
}

if(act==="editc"){
if(p.iced||p.perma)
throw Error("댓글이 얼음 상태라 수정할 수 없습니다. 얼음을 해제한 뒤 다시 시도하세요.");

const c=(comments.get(id)||[]).find(c=>c.id===cid);

if(!c||c.authorUid!==me.uid)
throw Error("본인 댓글만 수정할 수 있습니다.");

if(!editable(c.createdAt))
throw Error("댓글 수정 시간이 지났습니다.");

if((c.editCount||0)>=3)
throw Error("댓글 수정은 최대 3회까지 가능합니다.");

openCommentModal(id,c);
}

if(act==="delc"){
const c=(comments.get(id)||[]).find(c=>c.id===cid);

if(!c||c.authorUid!==me.uid)
throw Error("본인 댓글만 삭제할 수 있습니다.");

if(confirm("댓글을 휴지통으로 이동할까요?"))
await moveCommentToTrash(id,cid);
}
}catch(e){
alert(err(e));
}
});
</script>
</body>
</html>
